<script type="text/x-template" id="dc-tpl">
<div style="width: 100%; min-height: 100vh; background: #F5EEE8; color: #3A1410; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.55; overflow-x: clip">

  <!-- ================= HEADER ================= -->
  <header class="v-header" style="position: fixed; top: 18px; left: 24px; right: 24px; z-index: 60; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 12px 0 28px; border-radius: 14px; background: #F5EEE8; color: #3A1410; box-shadow: 0 2px 0 rgba(58, 20, 16, 0.06)">
    <a href="#top" aria-label="Valden, home" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
      <span style="font-family: 'Titan One', sans-serif; font-size: 30px; line-height: 1; color: #B03A2B; letter-spacing: 0.01em">VALDEN</span>
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#B03A2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 -2px 0 2px"><path d="M6 15 h 17 v 8 a 7 7 0 0 1 -7 7 h -3 a 7 7 0 0 1 -7 -7 z"></path><path d="M23 17 h 2 a 4 4 0 0 1 0 8 h -2"></path><path d="M11 11 c -2 -2 2 -4 0 -7 M17 11 c -2 -2 2 -4 0 -7"></path></svg>
      <span style="font-family: 'Mouse Memoirs', sans-serif; font-size: 18px; line-height: 1; padding: 4px 8px 2px; background: #EEC453; color: #6E231D; transform: rotate(-4deg)">GRAND CRU</span>

      <a class="v-wave" href="#notes"><span style="--i: 0">N</span><span style="--i: 1">o</span><span style="--i: 2">t</span><span style="--i: 3">e</span><span style="--i: 4">s</span></a>
      <a class="v-wave" href="#shop"><span style="--i: 0">S</span><span style="--i: 1">h</span><span style="--i: 2">o</span><span style="--i: 3">p</span></a>
      <a class="v-wave" href="#brew"><span style="--i: 0">B</span><span style="--i: 1">r</span><span style="--i: 2">e</span><span style="--i: 3">w</span><span style="--i: 4">&#160;</span><span style="--i: 5">b</span><span style="--i: 6">a</span><span style="--i: 7">r</span></a>

  </header>

  <!-- ================= HERO: open the tin ================= -->
  <section id="top" aria-label="Introduction" style="position: relative; height: calc(100vh + 3200px); color: #F5EEE8">
    <div id="vStage" style="--tw: min(23vw, 37vh, 360px); --jw: min(max(25.8vw, 220px), 45.8vh); position: sticky; top: 0; height: 100vh; min-height: 720px; overflow: hidden; background: #B03A2B">

      <!-- parallax beans (move with the pointer) -->
      <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; pointer-events: none">
        <img class="v-par" data-depth="18" alt="" src="./img/bean.webp" style="position: absolute; left: 7%; top: 30%; width: 76px; transform: rotate(-30deg); filter: blur(2px)">
        <img class="v-par" data-depth="12" alt="" src="./img/bean.webp" style="position: absolute; right: 18%; top: 22%; width: 46px; transform: rotate(20deg)">
        <img class="v-par" data-depth="24" alt="" src="./img/bean.webp" style="position: absolute; right: 6%; top: 64%; width: 120px; transform: rotate(-60deg); filter: blur(6px); opacity: 0.85">
      </div>

      <!-- state 1 -->
      <div id="vS1" style="position: absolute; inset: 0; z-index: 1">
        <p style="position: absolute; top: 122px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase">Less rush. More roast.</p>
        <h1 aria-label="Helios slowly. Valden grand cru coffee." style="position: absolute; top: 150px; left: 2%; right: 2%; margin: 0; display: flex; flex-direction: column; align-items: center; text-align: center; font-family: 'Titan One', sans-serif; font-weight: 400; color: #E9BFAE">

          <span aria-hidden="true" style="font-size: min(14.2vw, 214px); line-height: 0.95; letter-spacing: 0.005em">SLOWLY.</span>
        </h1>
        <div class="v-hc" style="position: absolute; left: 66px; bottom: 66px; width: 279px; z-index: 5">
          <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.6">Grand cru coffee, roasted in small lots and sealed by hand. Scroll to lift the lid.</p>
          <a class="v-btn" href="#shop" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 28px; background: #F5EEE8; color: #6E231D; font-family: 'Titan One', sans-serif; font-size: 17px; line-height: 1.55; text-decoration: none; white-space: nowrap">FIND YOUR TIN <img class="v-arr" alt="" aria-hidden="true" src="./img/doodle-arrow-sharp.svg" width="44" height="26" style="display: block; flex: none; width: 44px; height: 26px"></a>
        </div>
      </div>

      <!-- magnetic badge -->
      <a id="vBadge" href="#blends" class="v-mag" aria-label="See the three blends" style="position: absolute; right: 9.5%; top: 64.8%; z-index: 6; width: 149px; height: 151px; text-decoration: none">
        <span class="v-mag-in" style="background: #EEC453; color: #6E231D; transform: rotate(12deg)">
          <svg aria-hidden="true" viewBox="0 0 150 150" style="position: absolute; width: 150px; height: 150px; overflow: visible">
            <g class="v-spin" style="transform-origin: 75px 75px">
              <path id="badgeP" d="M75 75 m-54 0 a54 54 0 1 1 108 0 a54 54 0 1 1 -108 0" fill="none"></path>
              <text font-family="Titan One, sans-serif" font-size="14" letter-spacing="2" fill="#6E231D"><textPath href="#badgeP">THREE BLENDS · ONE RITUAL · </textPath></text>
            </g>
          </svg>
          <span style="font-family: 'Titan One', sans-serif; font-size: 34px; line-height: 1">↓</span>
        </span>
      </a>

      <!-- state 2: aroma -->
      <div id="vS2" aria-hidden="true" style="position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none">
        <span style="position: absolute; left: 14%; top: 26%; padding: 10px 18px 6px; background: #EEC453; color: #6E231D; font-family: 'Mouse Memoirs', sans-serif; font-size: 52px; line-height: 1; transform: rotate(-6deg)">COCOA NIB</span>
        <span style="position: absolute; right: 13%; top: 40%; padding: 10px 18px 6px; background: #DE5F2E; color: #F5EEE8; font-family: 'Mouse Memoirs', sans-serif; font-size: 52px; line-height: 1; transform: rotate(5deg)">MOLASSES</span>
        <span style="position: absolute; left: 18%; top: 62%; padding: 10px 18px 6px; background: #E9BFAE; color: #6E231D; font-family: 'Mouse Memoirs', sans-serif; font-size: 52px; line-height: 1; transform: rotate(4deg)">CEDAR</span>
        <p style="position: absolute; left: 0; right: 0; bottom: 56px; margin: 0; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #E9BFAE">Nuit · N° 01 · The aroma arrives first</p>
      </div>

      <!-- state 3 -->
      <div id="vS3" class="v-s3" style="position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; padding: 0 64px; opacity: 0; pointer-events: none">
        <div style="max-width: 560px">
          <span style="display: inline-block; padding: 8px 14px 4px; background: #EEC453; color: #6E231D; font-family: 'Mouse Memoirs', sans-serif; font-size: 26px; line-height: 1; transform: rotate(-3deg)">N° 01 · DARK ROAST</span>
          <h2 style="margin: 24px 0; font-family: 'Titan One', sans-serif; font-weight: 400; font-size: clamp(60px, 7vw, 108px); line-height: 0.95; color: #E9BFAE">A DARKER<br>KIND OF<br><span style="color: #EEC453">MORNING.</span></h2>
          <p style="margin: 0 0 28px; max-width: 380px; font-size: 16px; line-height: 1.7; color: #F3DCD2">Deep, velvety and slow to finish. Nuit is our darkest roast, for the cup you take your time with.</p>
          <button class="v-btn" type="button" onClick="{{openNuit}}" style="display: inline-flex; align-items: center; gap: 30px; min-height: 56px; padding: 0 26px; border: none; border-radius: 999px; background: #EEC453; color: #6E231D; font-family: 'Titan One', sans-serif; font-size: 17px">MEET NUIT <img class="v-arr" alt="" aria-hidden="true" src="./img/doodle-arrow-sharp.svg" width="44" height="26" style="display: block; flex: none; width: 44px; height: 26px"></button>
        </div>

        </sc-for>
        <img aria-hidden="true" alt="" src="./img/hero-jar.webp" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; filter: drop-shadow(0 40px 40px rgba(58,20,16,.25))">
      </div>

      <div aria-hidden="true" style="position: absolute; left: 66px; bottom: 28px; z-index: 6; display: flex; align-items: center; gap: 4px">
        <span id="vD0" style="width: 24px; height: 6px; border-radius: 3px; background: #F5EEE8; transition: width .3s, background-color .3s"></span>
        <span id="vD1" style="width: 6px; height: 6px; border-radius: 3px; background: rgba(245, 238, 232, 0.4); transition: width .3s, background-color .3s"></span>
        <span id="vD2" style="width: 6px; height: 6px; border-radius: 3px; background: rgba(245, 238, 232, 0.4); transition: width .3s, background-color .3s"></span>
      </div>
    </div>
  </section>


  <section class="v-sec v-stg" id="slow" aria-labelledby="stg-t">

  <!-- ================= INTERLUDE: a quiet line-drawn morning, on the page grid ================= -->
  <section class="v-sec" aria-labelledby="interlude-title" style="position: relative; background: #6E231D; color: #F5E6DA; padding: 200px 64px 160px">

          tagStyle: 'position: absolute; top: 18px; left: 18px; z-index: 2; padding: 7px 12px 4px; background: ' + p.tagBg + '; color: #6E231D; font-family: \'Mouse Memoirs\', sans-serif; font-size: 20px; line-height: 1; transform: rotate(-3deg);',
          quick: function () { self.add(p.id, 1); },
          quickLabel: 'Add ' + p.name + ' to bag',
          on: p.id === act, onCls: p.id === act ? ' on' : '', tint: p.tint,
          noteList: p.notes.split(', ').map(function (t) { return { t: t }; }),
          select: function () { self.setState({ panel: p.id }); },
          open: function () { self.setState({ detail: p.id, qty: 1 }); }
        });
      }),

      detailOpen: !!d,
      detail: d ? Object.assign(flags(d.id), {
        name: d.name, tag: d.tag, desc: d.desc, notes: d.notes, roast: d.roast, includes: d.includes,
        priceText: money(d.price), set: !!d.set,
        artStyle: 'flex: 1 1 360px; min-height: 380px; display: grid; place-items: center; padding: 30px; background: ' + d.tint + ';'
      }) : { set: false, isNuit: false, isVel: false, isAur: false },
      qty: st.qty,
      qtyUp: function () { self.setState({ qty: Math.min(20, st.qty + 1) }); },
      qtyDown: function () { self.setState({ qty: Math.max(1, st.qty - 1) }); },
      closeDetail: function () { self.setState({ detail: null }); },
      addDetail: function () { var id = st.detail, n = st.qty; self.setState({ detail: null, bagOpen: true }); self.add(id, n); },

      hasToast: !!st.toast,
      toast: st.toast
    };
  }
}

window.__bootValden(Component);
</script>
