# Captures reference sites listed in research/refs/urls.txt (screenshots, colours, fonts).
name: Capture reference sites

on:
  push:
    branches: [claude/gracious-fermat-bqbft2]
    paths:
      - .github/workflows/capture-refs.yml
      - research/refs/urls.txt
      - research/refs/capture.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Capture
        run: node research/refs/capture.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add research/refs
          git diff --cached --quiet || { git commit -m "Capture reference sites"; git pull --rebase; git push; }
